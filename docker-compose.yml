services:
  postgres:
    image: postgres:16-alpine
    container_name: bookshelf-postgres
    environment:
      POSTGRES_DB: bookshelf
      POSTGRES_USER: bookshelf
      POSTGRES_PASSWORD: bookshelf
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookshelf -d bookshelf"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: bookshelf-backend
    environment:
      DATABASE_URL: postgresql+psycopg://bookshelf:bookshelf@postgres:5432/bookshelf
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: bookshelf-frontend
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  postgres-data:
