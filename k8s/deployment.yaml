# Plain manifests, no Helm - the simplest way to get BookShelf onto a cluster.
#
#   kubectl apply -f k8s/
#
# The Helm chart in helm/bookshelf is the real deployment path: it adds postgres,
# probes, an Ingress, an HPA and templating. This exists to show the same thing
# without any templating in the way, and so the manifests can be read top to
# bottom. The backend runs on SQLite here so it needs no database alongside it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookshelf-backend
  namespace: bookshelf
  labels:
    app: bookshelf-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookshelf-backend
  template:
    metadata:
      labels:
        app: bookshelf-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/pirobeastie/bookshelf-backend:c078d199cf979142e9ac63b1d68c46118f4f9460
          ports:
            - name: http
              containerPort: 8000
          env:
            # /tmp because the image runs as uid 10001 and /app is not writable
            - name: DATABASE_URL
              value: "sqlite:////tmp/bookshelf.db"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookshelf-frontend
  namespace: bookshelf
  labels:
    app: bookshelf-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookshelf-frontend
  template:
    metadata:
      labels:
        app: bookshelf-frontend
    spec:
      initContainers:
        # nginx resolves the backend Service name at config load and exits if it
        # cannot, so wait for the backend to answer first
        - name: wait-for-backend
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -T 3 -O /dev/null http://bookshelf-backend:8000/health; do
                echo "waiting for the backend to answer..."
                sleep 2
              done
      containers:
        - name: frontend
          image: ghcr.io/pirobeastie/bookshelf-frontend:c078d199cf979142e9ac63b1d68c46118f4f9460
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
