server {
  # 8080 because the image is nginx-unprivileged and runs as a non-root user,
  # which cannot bind to port 80
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # the browser only ever talks to this nginx; it forwards /api to the backend
  # service (the compose service name, which is also the k8s service name)
  location /api/ {
    proxy_pass http://bookshelf-backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
