apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bookshelf.name" . }}-backend
  labels:
    {{- include "bookshelf.labels" . | nindent 4 }}
    app: {{ include "bookshelf.name" . }}-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: {{ include "bookshelf.name" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "bookshelf.name" . }}-backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            # the password comes from the Secret, and DATABASE_URL is built from
            # it - k8s only expands $(VAR) for variables declared above it
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bookshelf.name" . }}-postgres
                  key: password
            - name: DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.postgres.username }}:$(POSTGRES_PASSWORD)@{{ include "bookshelf.name" . }}-postgres:5432/{{ .Values.postgres.database }}"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
