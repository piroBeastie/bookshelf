apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bookshelf.name" . }}-frontend
  labels:
    {{- include "bookshelf.labels" . | nindent 4 }}
    app: {{ include "bookshelf.name" . }}-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: {{ include "bookshelf.name" . }}-frontend
  template:
    metadata:
      labels:
        app: {{ include "bookshelf.name" . }}-frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # nginx resolves the backend Service name when it loads its config and
      # exits if it cannot - so after a cluster restart, a frontend pod that
      # starts before CoreDNS is ready crashloops. this waits for DNS first.
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -T 3 -O /dev/null http://{{ include "bookshelf.name" . }}-backend:{{ .Values.backend.port }}/health; do
                echo "waiting for the backend to answer..."
                sleep 2
              done
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
